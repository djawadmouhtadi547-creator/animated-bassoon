name: Build Forge 1.12.2 mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Forge mod
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: prime-reality-glitch-forge-1.12.2
          path: build/libs/*.jar
